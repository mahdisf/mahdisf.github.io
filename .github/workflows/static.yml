# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

  # Refresh seven-day Mux playback tokens before they expire.
  schedule:
    - cron: "23 */12 * * *"

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v2
        with:
          # Pinned so a new Hugo release can't break a build months after the last update.
          # Change deliberately, after testing locally with the same version.
          hugo-version: '0.161.0'
          extended: true
      - name: Build site
        run: hugo --minify
      - name: Set up Python for Mux signing
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Mux signing dependency
        run: python3 -m pip install --disable-pip-version-check -r scripts/mux-signing-requirements.txt
      - name: Sign REAN video playback
        env:
          MUX_SIGNING_KEY_ID: ${{ secrets.MUX_SIGNING_KEY_ID }}
          MUX_SIGNING_PRIVATE_KEY: ${{ secrets.MUX_SIGNING_PRIVATE_KEY }}
        run: python3 scripts/sign_mux_embed.py public/REAN/index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload generated site from public/
          path: 'public'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
