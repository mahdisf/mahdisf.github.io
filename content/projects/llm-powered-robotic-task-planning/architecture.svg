<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
  <title id="t">LLM task-planning pipeline</title>
  <desc id="d">A natural-language instruction goes to an LLM planner using the Gemini API, which produces ROS2 actions for a simulated robotic arm in Gazebo.</desc>
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e2e8f0" stroke-width="1"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a}
    .b{fill:#fff;stroke:#94a3b8;stroke-width:2}
    .k{fill:#e8eef7;stroke:#002D62;stroke-width:2.5}
    .l{fill:none;stroke:#334155;stroke-width:2.5}
    .h{font-size:22px;font-weight:650}
    .s{font-size:16px;fill:#475569}
  </style>
  <rect width="960" height="540" fill="#f8fafc"/>
  <rect width="960" height="540" fill="url(#g)"/>
  <text x="48" y="64" class="s">LANGUAGE → PLAN → ROBOT ACTION (SIMULATION)</text>
  <rect x="48" y="200" width="220" height="130" rx="12" class="b"/>
  <text x="158" y="250" text-anchor="middle" class="h">Instruction</text>
  <text x="158" y="278" text-anchor="middle" class="s">natural language</text>
  <path d="M268 265H330" class="l" marker-end="url(#a)"/>
  <rect x="332" y="200" width="220" height="130" rx="12" class="k"/>
  <text x="442" y="250" text-anchor="middle" class="h">LLM planner</text>
  <text x="442" y="278" text-anchor="middle" class="s">Gemini API</text>
  <path d="M552 265H614" class="l" marker-end="url(#a)"/>
  <rect x="616" y="200" width="296" height="130" rx="12" class="b"/>
  <text x="764" y="250" text-anchor="middle" class="h">ROS2 actions</text>
  <text x="764" y="278" text-anchor="middle" class="s">simulated arm in Gazebo</text>
</svg>
