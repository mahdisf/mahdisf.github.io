<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
  <title id="t">Human-following robot architecture</title>
  <desc id="d">An Android phone runs a MobileNet person detector and sends direction commands over USB serial to an Arduino Uno, which drives four DC motors through an L298N driver. An ultrasonic sensor stops motion when an obstacle is within 1.5 metres.</desc>
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e2e8f0" stroke-width="1"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a}
    .b{fill:#fff;stroke:#94a3b8;stroke-width:2}
    .k{fill:#e8eef7;stroke:#002D62;stroke-width:2.5}
    .w{fill:#fff7ed;stroke:#c2410c;stroke-width:2}
    .l{fill:none;stroke:#334155;stroke-width:2.5}
    .h{font-size:22px;font-weight:650}
    .s{font-size:16px;fill:#475569}
    .c{font-size:15px;fill:#002D62;font-weight:600}
  </style>
  <rect width="960" height="540" fill="#f8fafc"/>
  <rect width="960" height="540" fill="url(#g)"/>
  <text x="48" y="64" class="s">EDGE VISION → EMBEDDED CONTROL</text>
  <rect x="48" y="150" width="250" height="130" rx="12" class="k"/>
  <text x="173" y="200" text-anchor="middle" class="h">Android phone</text>
  <text x="173" y="228" text-anchor="middle" class="s">MobileNet person tracking</text>
  <path d="M298 215H400" class="l" marker-end="url(#a)"/>
  <text x="349" y="196" text-anchor="middle" class="c">USB serial</text>
  <rect x="402" y="150" width="210" height="130" rx="12" class="b"/>
  <text x="507" y="200" text-anchor="middle" class="h">Arduino Uno</text>
  <text x="507" y="228" text-anchor="middle" class="s">direction commands</text>
  <path d="M612 215H700" class="l" marker-end="url(#a)"/>
  <rect x="702" y="150" width="210" height="130" rx="12" class="b"/>
  <text x="807" y="200" text-anchor="middle" class="h">L298N driver</text>
  <text x="807" y="228" text-anchor="middle" class="s">four DC motors</text>
  <rect x="402" y="360" width="210" height="100" rx="12" class="w"/>
  <text x="507" y="402" text-anchor="middle" class="h">Ultrasonic sensor</text>
  <text x="507" y="428" text-anchor="middle" class="s">stop if obstacle &lt; 1.5 m</text>
  <path d="M507 360V282" class="l" marker-end="url(#a)"/>
</svg>
