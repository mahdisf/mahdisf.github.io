<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" width="960" height="540" role="img" aria-labelledby="t d">
  <title id="t">Hierarchical navigation architecture</title>
  <desc id="d">A map and goal feed a high-level 2D navigation policy, which sends a bounded body-frame velocity command to a low-level 3D locomotion policy. The locomotion policy also receives 187 terrain height samples and outputs joint targets to a simulated quadruped. Robot state feeds back to both policies.</desc>
  <defs>
    <pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e2e8f0" stroke-width="1"/></pattern>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#334155"/></marker>
  </defs>
  <style>
    text{font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;fill:#0f172a}
    .b{fill:#fff;stroke:#94a3b8;stroke-width:2}
    .k{fill:#e8eef7;stroke:#002D62;stroke-width:2.5}
    .l{fill:none;stroke:#334155;stroke-width:2.5}
    .f{fill:none;stroke:#64748b;stroke-width:2;stroke-dasharray:7 6}
    .h{font-size:22px;font-weight:650}
    .s{font-size:16px;fill:#475569}
    .c{font-size:15px;fill:#002D62;font-weight:600}
  </style>
  <rect width="960" height="540" fill="#f8fafc"/>
  <rect width="960" height="540" fill="url(#g)"/>
  <text x="48" y="64" class="s">HIERARCHICAL DEEP RL · SIMULATION (ISAAC GYM)</text>

  <rect x="48" y="150" width="150" height="90" rx="12" class="b"/>
  <text x="123" y="190" text-anchor="middle" class="h">Map</text>
  <text x="123" y="216" text-anchor="middle" class="s">+ goal</text>
  <path d="M198 195H250" class="l" marker-end="url(#a)"/>

  <rect x="252" y="130" width="230" height="130" rx="12" class="b"/>
  <text x="367" y="182" text-anchor="middle" class="h">Navigation policy</text>
  <text x="367" y="210" text-anchor="middle" class="s">high level · 2D</text>

  <path d="M482 195H560" class="l" marker-end="url(#a)"/>
  <text x="521" y="110" text-anchor="middle" class="c">bounded</text>
  <text x="521" y="130" text-anchor="middle" class="c">velocity</text>
  <text x="521" y="150" text-anchor="middle" class="c">command</text>

  <rect x="562" y="130" width="230" height="130" rx="12" class="k"/>
  <text x="677" y="182" text-anchor="middle" class="h">Locomotion policy</text>
  <text x="677" y="210" text-anchor="middle" class="s">low level · 3D</text>

  <rect x="562" y="330" width="230" height="74" rx="12" class="b"/>
  <text x="677" y="364" text-anchor="middle" class="h">187 height samples</text>
  <text x="677" y="388" text-anchor="middle" class="s">body-centred terrain</text>
  <path d="M677 330V262" class="l" marker-end="url(#a)"/>

  <path d="M792 195H830" class="l" marker-end="url(#a)"/>
  <rect x="832" y="150" width="96" height="90" rx="12" class="b"/>
  <text x="880" y="190" text-anchor="middle" class="h">Robot</text>
  <text x="880" y="214" text-anchor="middle" class="s">joints</text>

  <path d="M880 240V460H367V262" class="f" marker-end="url(#a)"/>
  <text x="600" y="492" text-anchor="middle" class="s">robot state feeds back to both policies</text>
</svg>
