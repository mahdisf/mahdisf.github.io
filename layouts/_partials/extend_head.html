{{- if eq .Kind "page" }}
<style>
#reading-progress {
    position: fixed;
    top: 0;
    left: 0;
    width: 0%;
    height: 3px;
    background: linear-gradient(to right, #22c55e, #16a34a);
    z-index: 9999;
    transition: width 0.1s linear;
    pointer-events: none;
}
.copy-link-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
    cursor: pointer;
    background: none;
    border: none;
    padding: 6px;
    border-radius: 4px;
    color: var(--secondary);
    transition: color 0.15s;
    vertical-align: middle;
}
.copy-link-btn:hover { color: var(--primary); }
.copy-link-btn svg { display: block; }
.copy-link-btn.copied { color: #22c55e; }
</style>
<div id="reading-progress" role="progressbar" aria-label="Reading progress"></div>
<script>
(function () {
    const bar = document.getElementById('reading-progress');
    if (!bar) return;
    window.addEventListener('scroll', function () {
        const scrollTop = window.scrollY;
        const docHeight = document.documentElement.scrollHeight - window.innerHeight;
        bar.style.width = docHeight > 0 ? (scrollTop / docHeight * 100) + '%' : '100%';
    }, { passive: true });
})();
</script>
<script>
(function () {
    var copyTitle = {{ i18n "copy_link_title" | default "Copy link to this page" | jsonify }};
    var copiedTitle = {{ i18n "copy_link_copied" | default "Copied!" | jsonify }};
    document.addEventListener('DOMContentLoaded', function () {
        var shareSection = document.querySelector('.share-buttons, .post-footer');
        if (!shareSection) return;
        var btn = document.createElement('button');
        btn.className = 'copy-link-btn';
        btn.title = copyTitle;
        btn.setAttribute('aria-label', copyTitle);
        btn.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>';
        btn.addEventListener('click', function () {
            if (!navigator.clipboard) return;
            navigator.clipboard.writeText(window.location.href).then(function () {
                btn.classList.add('copied');
                btn.title = copiedTitle;
                setTimeout(function () {
                    btn.classList.remove('copied');
                    btn.title = copyTitle;
                }, 2000);
            });
        });
        shareSection.appendChild(btn);
    });
})();
</script>
{{- end }}
