{{- if and (.Param "comments") (ne .Section "logs") }}
<div class="giscus-container">
    <script src="https://giscus.app/client.js"
        data-repo="REPLACE_WITH_YOUR_GITHUB_USERNAME/REPLACE_WITH_YOUR_REPO_NAME"
        data-repo-id="REPLACE_WITH_REPO_ID"
        data-category="Announcements"
        data-category-id="REPLACE_WITH_CATEGORY_ID"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="bottom"
        data-theme="preferred_color_scheme"
        data-lang="{{ site.Language.Lang }}"
        crossorigin="anonymous"
        async>
    </script>
</div>
{{- end }}
