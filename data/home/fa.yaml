hero:
  name: "مهدی سرفرازی"
  title: "مدیر محصول فنی برای محصولات هوش مصنوعی و نرم‌افزارهای مهندسی"
  lead: "برای مهندس‌ها محصول هوش مصنوعی می‌سازم. کار را با کشف نیاز مشتری و تعیین محدوده MVP شروع می‌کنم و بعد در تحویل و اعتبارسنجی کنار تیم‌های مهندسی، طراحی و QA هستم."
  credibility: "پیش از ورود به مدیریت محصول، مهندس رباتیک و کنترل بودم و با ROS2، کنترل بلادرنگ تعبیه‌شده، شبیه‌سازی و یادگیری تقویتی کار می‌کردم."
  primary:
    label: "مشاهده کارهای محصولی"
    url: "#work"
  secondary:
    label: "تماس با من"
    url: "contact/"
  portraitAlt: "تصویر مهدی سرفرازی"

evidence:
  heading: "آنچه انجام داده‌ام"
  items:
    - label: "نقش فعلی"
      title: "یک پلتفرم طراحی کنترل مبتنی بر هوش مصنوعی را از ایده به MVP اعتبارسنجی‌شده رساندم"
      body: "مدیر محصول فنی یک استارتاپ هوش مصنوعی عامل‌محور هستم (نام محفوظ). کشف نیاز و نیازمندی‌ها را هدایت کردم و در تحویل با تیمی از هفت مهندس کار کردم. MVP دو چرخه اثبات مفهوم را گذراند و از دروازه آمادگی داخلی عبور کرد. برنامه ورود به بازار برای مرحله بعد را هم من نوشتم."
      link: "projects/ai-control-design-platform/"
      linkLabel: "مطالعه موردی (انگلیسی)"
    - label: "محصول مستقل"
      title: "ViGenX: ویرایشگر ویدئوی هوش مصنوعی که پیش از اجرا قابل بررسی است"
      body: "ViGenX را تعریف کردم و ساختم؛ یک ویرایشگر ویدئوی متن‌باز. شرح ساده یک ویرایش را به جریان کاری‌ای تبدیل می‌کند که می‌توانید بررسی و اصلاحش کنید، و تا تأیید نکنید رندر نمی‌کند. MVP اول را در دهمین استارتاپ کمپ دیجی‌نکست ارائه کردم. نسخه فعلی پیش از ۱.۰ است."
      link: "projects/vigenx-agentic-video-editor/"
      linkLabel: "مطالعه موردی (انگلیسی)"
    - label: "عمق مهندسی"
      title: "پژوهش رباتیک و کنترل، در شبیه‌سازی و روی سخت‌افزار"
      body: "نویسنده اول یک کنترل‌کننده بلادرنگ ROS2 برای اگزوسکلتون زانو هستم (پیش‌انتشار) و در پژوهش یادگیری تقویتی برای ناوبری ربات چهارپا هم‌نویسنده بودم (ICRoM 2025)."
      link: "projects/fuzzy-aan-knee-exoskeleton/"
      linkLabel: "مطالعه موردی اگزوسکلتون (انگلیسی)"

work:
  heading: "کارهای منتخب"
  intro: "اول مطالعات موردی محصول آمده‌اند و بعد کارهای مهندسی‌ای که تصمیم‌های محصولی‌ام بر آن‌ها تکیه دارد. مطالعات موردی به انگلیسی‌اند."
  allLabel: "همه کارها"

process:
  heading: "چگونه کار می‌کنم"
  intro: "چهار عادت کاری که به آن‌ها تکیه می‌کنم، هرکدام با نمونه‌ای از کار خودم."
  steps:
    - title: "کشف و صورت‌بندی مسئله"
      body: "از شیوه واقعی کار مهندس شروع می‌کنم. در پروژه اگزوسکلتون همین کار نیاز اصلی را روشن کرد: کمکی که آن‌قدر بزرگ باشد که زحمت پوشیدن خود دستگاه را جبران کند."
      link: "projects/fuzzy-aan-knee-exoskeleton/#the-problem"
      linkLabel: "اگزوسکلتون: مسئله (انگلیسی)"
    - title: "تعیین محدوده و تصمیم‌گیری"
      body: "در ViGenX مدل زبانی را از اجرا دور نگه داشتم. مدل فقط با بلوک‌های ثبت‌شده ویرایش را برنامه‌ریزی می‌کند و هر اجرا منتظر تأیید یک نفر می‌ماند."
      link: "projects/vigenx-agentic-video-editor/#key-product-decisions"
      linkLabel: "ViGenX: تصمیم‌ها (انگلیسی)"
    - title: "ساختن همراه با تیم"
      body: "داستان کاربر و معیار پذیرشی می‌نویسم که تیم بتواند بر اساسش بسازد و آزمون کند، و بک‌لاگ را بر اساس آنچه انتشار بعدی باید ثابت کند مرتب می‌کنم."
      link: "projects/ai-control-design-platform/#key-product-decisions"
      linkLabel: "پلتفرم طراحی کنترل: تصمیم‌ها (انگلیسی)"
    - title: "اعتبارسنجی و یادگیری"
      body: "در آزمایش اگزوسکلتون، دستگاه با موتور خاموش هم آزموده شد. پوشیدنش در این حالت تلاش عضلانی را بیشتر کرد، پس کنترل‌کننده باید اول بار خود دستگاه را جبران می‌کرد تا بتواند کمکی بکند."
      link: "projects/fuzzy-aan-knee-exoskeleton/#results"
      linkLabel: "اگزوسکلتون: نتایج (انگلیسی)"

decision:
  label: "یک تصمیم با جزئیات"
  question: "آیا مدل زبانی باید خودش ویدئو را ویرایش کند، یا ویرایشی را برنامه‌ریزی کند که یک نفر بتواند بررسی کند؟"
  options:
    - name: "تولید سرتاسری"
      body: "سریع‌ترین راه برای یک دمو. ولی نمی‌بینید مدل چه تصمیمی گرفته و نمی‌توانید ویرایش را با اطمینان تکرار کنید، و این برای ویدئوهایی که تعهدات حق نشر دارند مشکل است."
      chosen: false
    - name: "برنامه‌ریز محدود با تأیید انسانی"
      body: "در ابتدا مهندسی بیشتری می‌خواهد. در عوض پیش از هر رندر همه گام‌ها را می‌بینید و اصلاح می‌کنید و می‌توانید همان جریان کاری را بعداً دوباره اجرا کنید."
      chosen: true
  tradeoff: "هزینه‌اش این است که برنامه‌ریز فقط از بلوک‌های موجود استفاده می‌کند، پس هر قابلیت تازه به یک بلوک تازه نیاز دارد."
  link: "projects/vigenx-agentic-video-editor/#key-product-decisions"
  linkLabel: "استدلال کامل (انگلیسی)"
  chosenLabel: "انتخاب‌شده"

research:
