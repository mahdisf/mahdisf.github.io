          url: posts/
          weight: 3
        - name: Logs
          url: logs/
          weight: 5
        - name: Search
          url: search/
          weight: 6
        - name: Contact
          url: contact/
          weight: 7
  fa:
    label: "Farsi"
    locale: "fa-IR"
    direction: rtl
    title: "مهدی سرفرازی"
    weight: 2
    menu:
      main:
        - name: درباره
          url: about/
          weight: 1
        - name: الان
          url: now/
          weight: 2
        - name: پروژه‌ها
          url: projects/
          weight: 3
        - name: بلاگ
          url: posts/
          weight: 4
        - name: لاگ
          url: logs/
          weight: 5
        - name: جستجو
          url: search/
          weight: 6
        - name: تماس
          url: contact/
          weight: 7
    params:
      languageAltTitle: "فارسی"
      description: "وب‌سایت شخصی و وبلاگ فنی مهدی سرفرازی، مهندس نرم‌افزار رباتیک و مدیر محصول فنی در حوزه ROS2، خودمختاری ربات‌ها، شبیه‌سازی، کنترل و محصولات هوش مصنوعی."
      label:
        text: "مهدی سرفرازی"
      homeInfoParams:
        Title: "سلام، من مهدی هستم"
        Content: |
          مهندس نرم‌افزار رباتیک و مدیر محصول فنی؛ سازنده سامانه‌های خودمختار و محصولات مهندسی مبتنی بر هوش مصنوعی.

          با ROS2، Python و C++ سامانه‌های رباتیک را از شبیه‌سازی تا سخت‌افزار توسعه می‌دهم و با کشف مشتری، تعریف نیازمندی، اولویت‌بندی و هدایت تیم‌های چندتخصصی، ایده‌های فنی را به MVP تبدیل می‌کنم. اینجا درباره نرم‌افزار رباتیک، کنترل، هوش مصنوعی و مدیریت محصول فنی می‌نویسم.

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true
mainsections: ["posts"]

minify:
  disableXML: true

pagination:
  disableAliases: false
  pagerSize: 6

taxonomies:
  category: categories
  tag: tags
  series: series

fuseOpts:
  isCaseSensitive: false
  shouldSort: true
  location: 0
  distance: 1000
  threshold: 0.4
  minMatchCharLength: 2
  keys: ["title", "summary", "content", "tags"]

related:
  threshold: 80
  includeNewer: true
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: keywords
      weight: 80
    - name: date
      weight: 10

outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - llms

params:
  env: production
  title: "Mahdi Sarfarazi"
  displayFullLangName: true
  description: "Personal website and technical blog of Mahdi Sarfarazi, a robotics software engineer and technical product manager working on ROS2, robot autonomy, simulation, control, and AI products."
  keywords: ["robotics software engineer", "technical product manager", "robotics", "AI", "ROS2", "reinforcement learning", "robot control", "Isaac Gym", "Gazebo"]
  author: "Mahdi Sarfarazi"
  DateFormat: "January 2, 2006"

  mainSections: ["logs"]

  defaultTheme: auto
  ShowShareButtons: true
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  ShowWordCount: true
  hideFooter: false

  images: ["images/papermod-cover.png"]

  label:
    text: "Mahdi Sarfarazi"
    icon: "images/logo.svg"
    iconHeight: 30



  homeInfoParams:
    Title: "Hi, I'm Mahdi"
    Content: |
      Robotics software engineer and technical product manager building autonomous systems and AI-assisted engineering products.

      I develop ROS2 systems in Python and C++ from simulation to hardware, then use customer discovery, requirements, prioritization, and cross-functional delivery to turn technical ideas into MVPs. I write here about robotics software, control, AI, and technical product management.

  profileImage: "images/profile.jpg"

  socialIcons:
    - name: github
      title: GitHub
      url: "https://github.com/mahdisf"
    - name: linkedin
      title: LinkedIn
      url: "https://linkedin.com/in/sarfarazi"
    - name: email
      title: Email
      url: "mailto:Mahdi_Sarfarazi@outlook.com"

  social:
    twitter: "@yourtwitterhandle"

  schema:
    publisherType: "Person"

  comments: true
  ShowFullTextinRSS: true

  assets:
    disableHLJS: true
    favicon: "images/logo.svg"
    favicon16x16: "images/logo.svg"
    favicon32x32: "images/logo.svg"
    apple_touch_icon: "images/logo.svg"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

services:
  googleAnalytics:
    id: "G-JK9WJQ8F9C"
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
