baseURL: "https://mahdisf.ir"
title: "Mahdi Sarfarazi"

theme: ["PaperMod"]

defaultContentLanguage: en
defaultContentLanguageInSubdir: false
languages:
  en:
    label: "English"
    locale: "en-US"
    weight: 1
    menu:
      main:
        - name: Work
          url: projects/
          weight: 1
        - name: About
          url: about/
          weight: 2
        - name: Writing
          url: posts/
          weight: 3
        - name: Contact
          url: contact/
          weight: 4
      footer:
        - name: Now
          url: now/
          weight: 1
        - name: Search
          url: search/
          weight: 3
  fa:
    label: "فارسی"
    locale: "fa-IR"
    direction: rtl
    title: "مهدی سرفرازی"
    weight: 2
    menu:
      main:
        - name: نمونه‌کارها
          url: projects/
          weight: 1
        - name: درباره
          url: about/
          weight: 2
        - name: نوشته‌ها
          url: posts/
          weight: 3
        - name: تماس
          url: contact/
          weight: 4
      footer:
        - name: الان
          url: now/
          weight: 1
        - name: جستجو
          url: search/
          weight: 3
    params:
      languageAltTitle: "فارسی"
      description: "مهدی سرفرازی، مدیر محصول فنی برای محصولات هوش مصنوعی و نرم‌افزارهای مهندسی، با پیشینه عمیق در رباتیک، ROS2 و سیستم‌های کنترل."
      label:
        text: "مهدی سرفرازی"

enableInlineShortcodes: true
enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true
pygmentsUseClasses: true

minify:
  disableXML: true

pagination:
  disableAliases: false
  pagerSize: 6

taxonomies:
  category: categories
  tag: tags
  series: series

fuseOpts:
  isCaseSensitive: false
  shouldSort: true
  location: 0
  distance: 1000
  threshold: 0.4
  minMatchCharLength: 2
  keys: ["title", "summary", "content", "tags"]

related:
  threshold: 80
  includeNewer: true
  toLower: false
  indices:
    - name: tags
      weight: 100
    - name: keywords
      weight: 80
    - name: date
      weight: 10

outputFormats:
  llms:
    mediaType: "text/plain"
    baseName: "llms"
    isPlainText: true
    notAlternative: true

outputs:
  home:
    - HTML
    - RSS
    - JSON
    - llms

params:
  env: production
  title: "Mahdi Sarfarazi"
  displayFullLangName: true
  description: "Mahdi Sarfarazi is a technical product manager for AI and engineering software, with deep hands-on experience in robotics, ROS2 and control systems."
  keywords: ["technical product manager", "AI product manager", "engineering software", "robotics", "control systems", "ROS2", "product management", "MVP"]
  author: "Mahdi Sarfarazi"
  jobTitle: "Technical Product Manager"
  DateFormat: "January 2, 2006"

  # Sections whose pages count as "writing". Logs and projects are deliberately excluded.
  mainSections: ["posts"]

  defaultTheme: auto
  ShowShareButtons: true
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  ShowRssButtonInSectionTermList: true
  ShowAllPagesInArchive: true
  ShowPageNums: true
  ShowToc: true
  ShowWordCount: false
  hideFooter: false

  # Default social preview image (1200x630). Pages with a cover image use their own.
  images: ["images/social-card.png"]

  label:
    text: "Mahdi Sarfarazi"
    icon: "images/logo.svg"
    iconHeight: 30

  profileImage: "images/profile.jpg"
  avatarImage: "images/profile-avatar.jpg"   # 144px copy for the homepage hero

  socialIcons:
    - name: linkedin
      title: LinkedIn
      url: "https://www.linkedin.com/in/sarfarazi"
    - name: github
      title: GitHub
      url: "https://github.com/mahdisf"
    - name: email
      title: Email
      url: "mailto:Mahdi_Sarfarazi@outlook.com"

  contactEmail: "Mahdi_Sarfarazi@outlook.com"
  linkedin: "https://www.linkedin.com/in/sarfarazi"
  github: "https://github.com/mahdisf"

  schema:
    publisherType: "Person"
    sameAs:
      - "https://www.linkedin.com/in/sarfarazi"
      - "https://github.com/mahdisf"

  # Giscus comments render on writing (posts) only; see layouts/_partials/comments.html.
  comments: true
  ShowFullTextinRSS: true

  assets:
    disableHLJS: true
    favicon: "images/logo.svg"
    favicon16x16: "images/logo.svg"
    favicon32x32: "images/logo.svg"
    apple_touch_icon: "images/logo.svg"
    safari_pinned_tab: "images/logo.svg"
    theme_color: "#002D62"

markup:
  goldmark:
    renderer:
      unsafe: true
  highlight:
    noClasses: false

services:
  googleAnalytics:
    id: "G-JK9WJQ8F9C"
  instagram:
    disableInlineCSS: true
  x:
    disableInlineCSS: true
